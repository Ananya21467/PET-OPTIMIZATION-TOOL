
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Pets | Pet Optimization Tool</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f7f8f5;
            color: #29483b;
            min-height: 100vh;
        }

        header {
            background: #29483b;
            color: white;
            padding: 20px 6%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        header h1 {
            font-size: 24px;
        }

        .logout-btn {
            background: transparent;
            color: white;
            border: 1px solid white;
            padding: 9px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
        }

        .page-container {
            max-width: 1100px;
            margin: auto;
            padding: 35px 20px;
        }

        .page-heading {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 18px;
            flex-wrap: wrap;
            margin-bottom: 28px;
        }

        .page-heading h2 {
            font-size: 28px;
            margin-bottom: 8px;
        }

        .page-heading p {
            color: #66766d;
            font-size: 15px;
        }

        .add-btn {
            background: #315c49;
            color: white;
            border: none;
            padding: 12px 18px;
            border-radius: 9px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
        }

        .add-btn:hover {
            background: #244b39;
        }

        .pets-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 22px;
        }

        .pet-card {
            background: white;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 5px 18px rgba(41, 72, 59, 0.08);
            border: 1px solid #e5ebe5;
        }

        .pet-photo {
            height: 190px;
            background: #e5eee5;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 65px;
        }

        .pet-details {
            padding: 20px;
        }

        .pet-details h3 {
            font-size: 21px;
            margin-bottom: 10px;
        }

        .pet-details p {
            color: #66766d;
            font-size: 14px;
            margin-bottom: 8px;
        }

        .view-btn {
            display: block;
            width: 100%;
            margin-top: 18px;
            padding: 12px;
            background: #dcebdc;
            color: #244b39;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
        }

        .view-btn:hover {
            background: #c9dfca;
        }

        .empty-message {
            background: white;
            border: 1px dashed #b7cabb;
            border-radius: 14px;
            text-align: center;
            padding: 35px 20px;
            margin-top: 20px;
        }

        .empty-message .paw {
            font-size: 45px;
            margin-bottom: 12px;
        }

        .empty-message h3 {
            margin-bottom: 10px;
        }

        .empty-message p {
            color: #66766d;
            margin-bottom: 18px;
            line-height: 1.5;
        }

        [hidden] {
            display: none !important;
        }

        @media (max-width: 600px) {
            header {
                padding: 17px 20px;
            }

            header h1 {
                font-size: 19px;
            }

            .page-container {
                padding: 25px 16px;
            }

            .page-heading h2 {
                font-size: 24px;
            }

            .add-btn {
                width: 100%;
            }

            .pets-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>
    <header>
        <h1>🐾 Pet Optimization Tool</h1>
        <button class="logout-btn" id="logoutBtn" type="button">
            Logout
        </button>
    </header>

    <main class="page-container">
        <section class="page-heading">
            <div>
                <h2>My Pets 🐶🐱</h2>
                <p>Manage your pets and view their health information.</p>
            </div>

            <button class="add-btn" id="addPetBtn" type="button">
                + Add Another Pet
            </button>
        </section>

        <section class="pets-grid" id="petsGrid" hidden>
            <!-- Saved pet cards will be loaded here -->
        </section>

        <section class="empty-message" id="emptyMessage">
            <div class="paw">🐾</div>
            <h3>No Pet Profiles Yet</h3>
            <p>
                Add your first pet to start managing its food,
                medicine, disease and vaccination information.
            </p>

            <button class="add-btn" id="firstPetBtn" type="button">
                Create Pet Profile
            </button>
        </section>
    </main>

    <script>
        document.getElementById("addPetBtn").addEventListener("click", function () {
            window.location.href = "pet-profile.html";
        });

        document.getElementById("firstPetBtn").addEventListener("click", function () {
            window.location.href = "pet-profile.html";
        });

        document.getElementById("logoutBtn").addEventListener("click", function () {
            alert("Logout will be available after secure authentication is connected.");
        });
    </script>
</body>
</html>
