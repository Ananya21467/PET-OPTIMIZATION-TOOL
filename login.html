
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Pet Optimization Tool</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f7f8f5;
            color: #29483b;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .login-container {
            background: white;
            width: 100%;
            max-width: 420px;
            padding: 35px 28px;
            border-radius: 18px;
            box-shadow: 0 8px 25px rgba(41, 72, 59, 0.10);
        }

        .logo {
            text-align: center;
            font-size: 42px;
            margin-bottom: 10px;
        }

        h1 {
            text-align: center;
            font-size: 27px;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #66766d;
            font-size: 14px;
            margin-bottom: 28px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #d5ded7;
            border-radius: 9px;
            font-size: 15px;
        }

        input:focus {
            outline: 2px solid #8ab69a;
            border-color: #315c49;
        }

        .login-btn {
            width: 100%;
            padding: 14px;
            background: #315c49;
            color: white;
            border: none;
            border-radius: 9px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 5px;
        }

        .login-btn:hover {
            background: #244b39;
        }

        .signup-text {
            text-align: center;
            font-size: 14px;
            margin-top: 22px;
        }

        .signup-text a {
            color: #315c49;
            font-weight: bold;
            text-decoration: none;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 18px;
            color: #66766d;
            font-size: 13px;
            text-decoration: none;
        }

        @media (max-width: 480px) {
            .login-container {
                padding: 28px 22px;
            }

            h1 {
                font-size: 24px;
            }
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>
    <main class="login-container">
        <div class="logo">🐾</div>

        <h1>Welcome Back!</h1>
        <p class="subtitle">
            Login to access your pets' profiles
        </p>

        <form id="loginForm">
            <div class="form-group">
                <label for="email">Email Address</label>
                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
                >
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    required
                >
            </div>

            <button type="submit" class="login-btn">
                Login
            </button>
        </form>

        <p class="signup-text">
            Don't have an account?
            <a href="signup.html">Sign Up</a>
        </p>

        <a href="index.html" class="back-link">
            ← Back to Home
        </a>
    </main>

    
<script>
    const SUPABASE_URL = "https://lqyjdprlgulcqnagpisr.supabase.co";
    const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_iNhGuMwP7Ro8RBne6MLuDQ_mth-P02n";

    const supabaseClient = window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
    );

     const loginForm = document.querySelector("form");

    loginForm.addEventListener("submit", async function (event) {
        event.preventDefault();

        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value;

        const { data, error } = await supabaseClient.auth.signInWithPassword({
            email: email,
            password: password
        });

        if (error) {
            alert(error.message);
            return;
        }

        alert("Login successful! Welcome back.");
       window.location.href = "my-pets.html";
    });
</script>

</body>
</html>
